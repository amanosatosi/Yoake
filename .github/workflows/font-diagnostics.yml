name: Myanmar font diagnostics
on:
  workflow_dispatch:
  push:
    branches: [codex/daily-driver-improvements]
    paths:
      - '.github/workflows/font-diagnostics.yml'
      - 'tools/FontDiagnostics/**'
      - 'ci/font_diagnostics.py'
permissions:
  contents: read
jobs:
  diagnostics:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.403'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Obtain independent HarfBuzz reference and exact font binaries
        run: |
          python -m pip install uharfbuzz fonttools
          python ci/font_diagnostics.py artifacts/font-diagnostics
          python -m pip freeze > artifacts/font-diagnostics/python-versions.txt
      - name: Build standalone Avalonia probe
        run: dotnet build tools/FontDiagnostics/FontDiagnostics.csproj -c Release -o artifacts/font-diagnostic-host
      - name: Record UI shaping and rendering across all fonts
        shell: pwsh
        run: |
          $root = (Resolve-Path artifacts/font-diagnostics).Path
          $exe = (Resolve-Path artifacts/font-diagnostic-host/FontDiagnostics.exe).Path
          $failed = $false
          foreach ($font in Get-ChildItem "$root/inputs/*.ttf") {
            $dest = Join-Path $root $font.BaseName
            & $exe $font.FullName "$root/samples.txt" $dest ui *> "$dest/ui.log"
            if ($LASTEXITCODE -ne 0) { $failed = $true; Get-Content "$dest/ui.log" }
          }
          if ($failed) { throw 'One or more UI probes failed; see artifacts.' }
      - uses: ilammy/msvc-dev-cmd@v1
        if: ${{ !cancelled() }}
      - name: Build only Mangetsu, not the full media stack
        if: ${{ !cancelled() }}
        run: |
          python -m pip install meson==1.9.1 ninja==1.13.0
          .\ci\build_dependencies.ps1 -OutputRoot .ci-cache\native -Stage Mangetsu
      - name: Render same fonts with Mangetsu
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $root = (Resolve-Path artifacts/font-diagnostics).Path
          # MSVC setup exports Platform=x64. Launch the exact executable built
          # earlier, without letting dotnet run re-evaluate the MSBuild path.
          $bin = (Resolve-Path artifacts/font-diagnostic-host).Path
          $exe = (Resolve-Path "$bin/FontDiagnostics.exe").Path
          Copy-Item .ci-cache/native/mangetsu/bin/mangetsu.dll $bin
          Copy-Item .ci-cache/native/mangetsu/resolved-commit.txt "$root/mangetsu-commit.txt"
          $manifest = Get-Content "$root/font-manifest.json" -Raw | ConvertFrom-Json
          $failed = $false
          foreach ($font in Get-ChildItem "$root/inputs/*.ttf") {
            $dest = Join-Path $root $font.BaseName
            & $exe $font.FullName "$root/samples.txt" $dest mangetsu *> "$dest/mangetsu.log"
            if ($LASTEXITCODE -ne 0) { $failed = $true; Get-Content "$dest/mangetsu.log" }
            # The embedded provider identifies memory fonts by PostScript name,
            # not by attachment filename. Compare the first selected face with
            # the pinned input's name table. Later Latin fallback is legitimate.
            $expected = $manifest.fonts | Where-Object { $_.file -eq $font.Name } | Select-Object -First 1
            $first = Select-String -Path "$dest/mangetsu.log" -Pattern 'fontselect: \(' | Select-Object -First 1
            $pattern = '->\s*' + [regex]::Escape([string]$expected.postscript) + ',\s*0,\s*' + [regex]::Escape([string]$expected.postscript) + '\s*
          }
          if ($failed) { throw 'One or more Mangetsu probes failed; see artifacts.' }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Myanmar-font-diagnostics
          path: |
            artifacts/font-diagnostics
            !artifacts/font-diagnostics/inputs/**
            !artifacts/font-diagnostics/**/*.ass
          if-no-files-found: warn

            if (-not $expected.postscript -or -not $first -or $first.Line -notmatch $pattern) {
              $failed = $true
              Write-Host "Reference face selection not confirmed for $($font.Name); expected $($expected.postscript)"
              Get-Content "$dest/mangetsu.log"
            } else {
              Write-Host "Confirmed $($font.Name): $($first.Line)"
            }
          }
          if ($failed) { throw 'One or more Mangetsu probes failed; see artifacts.' }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Myanmar-font-diagnostics
          path: |
            artifacts/font-diagnostics
            !artifacts/font-diagnostics/inputs/**
            !artifacts/font-diagnostics/**/*.ass
          if-no-files-found: warn
