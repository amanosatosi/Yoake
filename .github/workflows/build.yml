name: Build, test, NativeAOT, package

on:
  push:
    branches: [main, csharp-ban, "codex/**", "sol/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validate architecture policy and generated SVG catalog
        run: python ci/source_policy.py

  managed-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.401"
      - name: Restore core tests
        run: dotnet restore tests/Yoake.Core.Tests/Yoake.Core.Tests.csproj
      - name: Build core tests
        run: dotnet build tests/Yoake.Core.Tests/Yoake.Core.Tests.csproj -c Release --no-restore
      - name: Build editor UI and compiled bindings
        run: dotnet build src/Yoake.UI/Yoake.UI.csproj -c Release
      - name: Test document workflows through UI command model
        run: dotnet test tests/Yoake.UI.Tests/Yoake.UI.Tests.csproj -c Release
      - name: Test core
        run: dotnet test tests/Yoake.Core.Tests/Yoake.Core.Tests.csproj -c Release --no-build

  windows-nativeaot:
    runs-on: windows-latest
    timeout-minutes: 180
    needs: [source-policy, managed-tests]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.401"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: ilammy/msvc-dev-cmd@v1

      - name: Resolve deterministic native cache keys
        id: native-keys
        shell: pwsh
        run: |
          $v = Get-Content third_party\versions.json -Raw | ConvertFrom-Json
          $ffmpeg = "yoake-csharp-ffmpeg-win-x64-v1-$($v.vcpkg.commit)-$($v.ffmpeg.tagCommit)-p$($v.ffmpeg.vcpkgPortVersion)-${{ hashFiles('third_party/ffmpeg/**', 'ci/build_dependencies.ps1') }}"
          $ffms2 = "yoake-csharp-ffms2-win-x64-v1-$($v.ffms2.commit)-${{ hashFiles('third_party/ffms2/**', 'ci/build_dependencies.ps1') }}-$ffmpeg"
          "ffmpeg=$ffmpeg" >> $env:GITHUB_OUTPUT
          "ffms2=$ffms2" >> $env:GITHUB_OUTPUT

      - name: Restore FFmpeg cache
        id: ffmpeg-cache
        uses: actions/cache/restore@v6
        with:
          path: .ci-cache/native/ffmpeg
          key: ${{ steps.native-keys.outputs.ffmpeg }}
      - name: Restore vcpkg binary archives
        id: vcpkg-cache
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v6
        with:
          path: .ci-cache/vcpkg-binaries
          key: ${{ steps.native-keys.outputs.ffmpeg }}-vcpkg-v1
          restore-keys: |
            yoake-csharp-ffmpeg-win-x64-v1-
      - name: Build pinned FFmpeg
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: .\ci\build_dependencies.ps1 -OutputRoot .ci-cache\native -Stage FFmpeg
      - name: Save FFmpeg cache
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .ci-cache/native/ffmpeg
          key: ${{ steps.native-keys.outputs.ffmpeg }}
      - name: Save vcpkg binary archives
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true' && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .ci-cache/vcpkg-binaries
          key: ${{ steps.native-keys.outputs.ffmpeg }}-vcpkg-v1

      - name: Restore FFMS2 cache
        id: ffms2-cache
        uses: actions/cache/restore@v6
        with:
          path: .ci-cache/native/ffms2
          key: ${{ steps.native-keys.outputs.ffms2 }}
      - name: Build pinned FFMS2
        if: steps.ffms2-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: .\ci\build_dependencies.ps1 -OutputRoot .ci-cache\native -Stage FFMS2
      - name: Save FFMS2 cache
        if: steps.ffms2-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .ci-cache/native/ffms2
          key: ${{ steps.native-keys.outputs.ffms2 }}

      - name: Install Mangetsu build tools
        run: python -m pip install --disable-pip-version-check meson==1.9.1 ninja==1.13.0
      - name: Build latest Mangetsu branch
        shell: pwsh
        run: .\ci\build_dependencies.ps1 -OutputRoot .ci-cache\native -Stage Mangetsu

      - name: Finalize dependency stack and license bundle
        shell: pwsh
        run: .\ci\build_dependencies.ps1 -OutputRoot .ci-cache\native -Stage Finalize

      - name: Install deterministic app-icon renderer
        shell: pwsh
        run: |
          choco install imagemagick --version=7.1.2.2500 -y --no-progress
          $magick = Get-ChildItem 'C:\Program Files\ImageMagick-*\magick.exe' -File -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $magick) { throw 'ImageMagick installation did not provide magick.exe' }
          $magick.Directory.FullName >> $env:GITHUB_PATH
          & $magick.FullName -version
      - name: Restore app
        run: dotnet restore src/Yoake.App/Yoake.App.csproj -r win-x64
      - name: Publish Windows NativeAOT
        run: dotnet publish src/Yoake.App/Yoake.App.csproj -c Release -r win-x64 --self-contained true --no-restore -p:PublishAot=true -o artifacts/publish
      - name: Package portable application
        shell: pwsh
        run: .\ci\package_windows.ps1 -PublishRoot artifacts\publish -NativeRoot .ci-cache\native -OutputRoot artifacts
      - name: Verify staged native runtime closure
        shell: pwsh
        run: .\ci\verify_windows_runtime.ps1 -PortableRoot artifacts\Yoake-Windows-x64-portable
      - name: Smoke packaged NativeAOT executable
        shell: pwsh
        run: .\ci\smoke_windows.ps1 -Executable artifacts\Yoake-Windows-x64-portable\Yoake.exe
      - name: Verify packaged editor domain and native media/rendering providers
        shell: pwsh
        run: |
          python ci/create_editor_media_fixtures.py artifacts/editor-fixtures
          $exe = (Resolve-Path artifacts/Yoake-Windows-x64-portable/Yoake.exe).Path
          $fixtures = (Resolve-Path artifacts/editor-fixtures).Path
          $report = Join-Path $fixtures 'verification.txt'
          $process = Start-Process -FilePath $exe -ArgumentList @('--verify-editor', $fixtures, $report) -WindowStyle Hidden -PassThru
          if (-not $process.WaitForExit(60000)) { $process.Kill(); throw 'Packaged editor verification timed out.' }
          if (Test-Path $report) { Get-Content $report }
          if ($process.ExitCode -ne 0) { throw "Packaged editor verification failed: $($process.ExitCode)" }
      - uses: actions/upload-artifact@v7
        with:
          name: Yoake-Windows-x64-NativeAOT-portable
          path: artifacts/Yoake-Windows-x64-portable.zip
          if-no-files-found: error
          compression-level: 0
