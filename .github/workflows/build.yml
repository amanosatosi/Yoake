name: Build, test, and package

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows x64 portable / Qt 6.8 / FFMS2
    runs-on: windows-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          arch: win64_msvc2022_64
          modules: qtmultimedia
          cache: true

      - name: Restore pinned native dependency stack
        id: native-cache
        uses: actions/cache@v4
        with:
          path: .ci-cache/native
          key: yoake-native-windows-x64-v4-${{ hashFiles('third_party/**', 'ci/build_dependencies.ps1') }}

      - name: Install native build frontend
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: python -m pip install meson==1.7.2

      - name: Build pinned FFmpeg, FFMS2, and Mangetsu
        if: steps.native-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: .\ci\build_dependencies.ps1 -OutputRoot .ci-cache\native

      - name: Validate native dependency cache
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath .ci-cache\native\.complete)) {
            throw "Native dependency cache is incomplete"
          }
          Get-Content -LiteralPath .ci-cache\native\versions.json

      - name: Configure Yoake
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON
          -DFFMS2_ROOT=${{ github.workspace }}\.ci-cache\native\ffms2

      - name: Build Yoake
        run: cmake --build build --parallel 2

      - name: Test exact timing and document core
        run: ctest --test-dir build --output-on-failure

      - name: Stage portable application and licenses
        shell: pwsh
        run: >-
          .\ci\package_windows.ps1
          -BuildRoot build
          -NativeRoot .ci-cache\native
          -OutputRoot artifacts

      - name: Verify native runtimes, ABI chain, exports, and startup
        shell: pwsh
        run: .\ci\verify_portable.ps1 -PortableRoot artifacts\Yoake-Windows-x64-portable

      - name: Upload portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Yoake-Windows-x64-portable
          path: artifacts/Yoake-Windows-x64-portable.zip
          if-no-files-found: error
          compression-level: 0

  source-policy:
    name: Source and dependency policy checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate architecture, pins, JSON, and source manifest
        shell: python
        run: |
          import json
          import pathlib
          import re

          root = pathlib.Path(".")
          for path in root.glob("resources/themes/*.json"):
              data = json.loads(path.read_text(encoding="utf-8"))
              assert data.get("name"), f"{path}: missing name"
              assert len(data.get("colors", {})) >= 30, f"{path}: incomplete semantic palette"

          versions = json.loads((root / "third_party/versions.json").read_text(encoding="utf-8"))
          pins = [
              versions["vcpkg"]["commit"],
              versions["ffmpeg"]["tagCommit"],
              versions["ffms2"]["commit"],
              versions["mangetsu"]["commit"],
              versions["mangetsuFontStack"]["freetype"],
              versions["mangetsuFontStack"]["fribidi"],
              versions["mangetsuFontStack"]["harfbuzz"],
          ]
          assert all(re.fullmatch(r"[0-9a-f]{40}", pin) for pin in pins), "native dependency refs must be immutable commits"
          json.loads((root / "third_party/ffmpeg/vcpkg.json").read_text(encoding="utf-8"))

          cmake = (root / "CMakeLists.txt").read_text(encoding="utf-8")
          for path in re.findall(r"(?:src|qml|resources|tests)/[^\s\)]+\.[A-Za-z0-9]+", cmake):
              assert (root / path).is_file(), f"CMake source does not exist: {path}"
          assert "FFMS2::FFMS2" in cmake, "Yoake must link the FFMS2 source layer"

          media_source = "\n".join(
              path.read_text(encoding="utf-8")
              for folder in (root / "src", root / "qml")
              for path in folder.rglob("*") if path.suffix in {".cpp", ".h", ".qml"}
          )
          assert "QMediaPlayer" not in media_source, "QMediaPlayer must not be a decode backend"
          assert "QAudioDecoder" not in media_source, "QAudioDecoder must not be an audio source"
          assert "VideoOutput" not in media_source, "Qt VideoOutput must not own decoded frames"
          assert "frameRate = 24" not in media_source and "m_frameRate = 24" not in media_source, "frame identity must not assume 24 fps"

          renderer = (root / "src/renderer/mangetsu_library.cpp").read_text(encoding="utf-8").lower()
          assert all(name not in renderer for name in ("libass", "vsfilter", "xy-vsfilter")), "renderer loader contains a fallback backend"

          workflow = (root / ".github/workflows/build.yml").read_text(encoding="utf-8")
          assert "Yoake-Windows-x64-portable.zip" in workflow
          assert "verify_portable.ps1" in workflow
