name: Build, test, and package

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows x64 portable / Qt 6.8 / FFMS2
    runs-on: windows-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          arch: win64_msvc2022_64
          modules: qtmultimedia
          cache: true

      - name: Resolve isolated native cache keys
        id: native-cache-keys
        shell: pwsh
        run: |
          $versions = Get-Content -LiteralPath third_party\versions.json -Raw | ConvertFrom-Json
          $ffmpeg = "yoake-ffmpeg-windows-x64-v1-$($versions.vcpkg.commit)-$($versions.ffmpeg.tagCommit)-p$($versions.ffmpeg.vcpkgPortVersion)-$($versions.ffmpeg.linkage)-${{ hashFiles('third_party/ffmpeg/**') }}"
          $ffms2 = "yoake-ffms2-windows-x64-v1-$($versions.ffms2.commit)-$($versions.ffms2.linkage)-${{ hashFiles('third_party/ffms2/**') }}-$ffmpeg"
          $mangetsu = "yoake-mangetsu-windows-x64-v1-$($versions.mangetsu.commit)-$($versions.mangetsu.linkage)-$($versions.mangetsu.transitiveLinkage)-$($versions.mangetsuFontStack.freetype)-$($versions.mangetsuFontStack.fribidi)-$($versions.mangetsuFontStack.harfbuzz)-${{ hashFiles('third_party/mangetsu/**') }}"
          "ffmpeg=$ffmpeg" >> $env:GITHUB_OUTPUT
          "ffms2=$ffms2" >> $env:GITHUB_OUTPUT
          "mangetsu=$mangetsu" >> $env:GITHUB_OUTPUT

      - name: Restore pinned FFmpeg cache
        id: ffmpeg-cache
        uses: actions/cache/restore@v4
        with:
          path: .ci-cache/native/ffmpeg
          key: ${{ steps.native-cache-keys.outputs.ffmpeg }}

      - name: Restore vcpkg archives to seed FFmpeg cache
        id: ffmpeg-vcpkg-cache
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: .ci-cache/vcpkg-binaries
          key: ${{ steps.native-cache-keys.outputs.ffmpeg }}-vcpkg-archives-v1
          restore-keys: |
            yoake-vcpkg-binaries-windows-x64-v1-

      - name: Build pinned FFmpeg
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: .\ci\build_dependencies.ps1 -OutputRoot .ci-cache\native -Stage FFmpeg

      - name: Save pinned FFmpeg cache
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .ci-cache/native/ffmpeg
          key: ${{ steps.native-cache-keys.outputs.ffmpeg }}

      - name: Save isolated vcpkg archives
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true' && steps.ffmpeg-vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .ci-cache/vcpkg-binaries
          key: ${{ steps.native-cache-keys.outputs.ffmpeg }}-vcpkg-archives-v1

      - name: Restore pinned FFMS2 cache
        id: ffms2-cache
        uses: actions/cache/restore@v4
        with:
          path: .ci-cache/native/ffms2
          key: ${{ steps.native-cache-keys.outputs.ffms2 }}

      - name: Build pinned FFMS2 against cached FFmpeg
        if: steps.ffms2-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: .\ci\build_dependencies.ps1 -OutputRoot .ci-cache\native -Stage FFMS2

      - name: Save pinned FFMS2 cache
        if: steps.ffms2-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .ci-cache/native/ffms2
          key: ${{ steps.native-cache-keys.outputs.ffms2 }}

      - name: Restore pinned Mangetsu cache
        id: mangetsu-cache
        uses: actions/cache/restore@v4
        with:
          path: .ci-cache/native/mangetsu
          key: ${{ steps.native-cache-keys.outputs.mangetsu }}

      - name: Install Mangetsu build frontend
        if: steps.mangetsu-cache.outputs.cache-hit != 'true'
        run: python -m pip install meson==1.7.2

      - name: Build pinned Mangetsu
        if: steps.mangetsu-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: .\ci\build_dependencies.ps1 -OutputRoot .ci-cache\native -Stage Mangetsu

      - name: Save pinned Mangetsu cache
        if: steps.mangetsu-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .ci-cache/native/mangetsu
          key: ${{ steps.native-cache-keys.outputs.mangetsu }}

      - name: Finalize native dependency stack and licenses
        shell: pwsh
        run: .\ci\build_dependencies.ps1 -OutputRoot .ci-cache\native -Stage Finalize

      - name: Validate native dependency cache
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath .ci-cache\native\.complete)) {
            throw "Native dependency cache is incomplete"
          }
          Get-Content -LiteralPath .ci-cache\native\versions.json

      - name: Configure Yoake
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON
          -DFFMS2_ROOT=${{ github.workspace }}\.ci-cache\native\ffms2

      - name: Build Yoake
        run: cmake --build build --parallel 2

      - name: Test exact timing and document core
        run: ctest --test-dir build --output-on-failure --timeout 30

      - name: Stage portable application and licenses
        shell: pwsh
        run: >-
          .\ci\package_windows.ps1
          -BuildRoot build
          -NativeRoot .ci-cache\native
          -OutputRoot artifacts

      - name: Verify native runtimes, ABI chain, exports, and startup
        shell: pwsh
        run: .\ci\verify_portable.ps1 -PortableRoot artifacts\Yoake-Windows-x64-portable

      - name: Upload portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Yoake-Windows-x64-portable
          path: artifacts/Yoake-Windows-x64-portable.zip
          if-no-files-found: error
          compression-level: 0

  source-policy:
    name: Source and dependency policy checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate architecture, pins, JSON, and source manifest
        shell: python
        run: |
          import json
          import pathlib
          import re

          root = pathlib.Path(".")
          for path in root.glob("resources/themes/*.json"):
              data = json.loads(path.read_text(encoding="utf-8"))
              assert data.get("name"), f"{path}: missing name"
              assert len(data.get("colors", {})) >= 30, f"{path}: incomplete semantic palette"

          versions = json.loads((root / "third_party/versions.json").read_text(encoding="utf-8"))
          pins = [
              versions["vcpkg"]["commit"],
              versions["ffmpeg"]["tagCommit"],
              versions["ffms2"]["commit"],
              versions["mangetsu"]["commit"],
              versions["mangetsuFontStack"]["freetype"],
              versions["mangetsuFontStack"]["fribidi"],
              versions["mangetsuFontStack"]["harfbuzz"],
          ]
          assert all(re.fullmatch(r"[0-9a-f]{40}", pin) for pin in pins), "native dependency refs must be immutable commits"
          json.loads((root / "third_party/ffmpeg/vcpkg.json").read_text(encoding="utf-8"))

          cmake = (root / "CMakeLists.txt").read_text(encoding="utf-8")
          for path in re.findall(r"(?:src|qml|resources|tests)/[^\s\)]+\.[A-Za-z0-9]+", cmake):
              assert (root / path).is_file(), f"CMake source does not exist: {path}"
          assert "FFMS2::FFMS2" in cmake, "Yoake must link the FFMS2 source layer"

          media_source = "\n".join(
              path.read_text(encoding="utf-8")
              for folder in (root / "src", root / "qml")
              for path in folder.rglob("*") if path.suffix in {".cpp", ".h", ".qml"}
          )
          assert "QMediaPlayer" not in media_source, "QMediaPlayer must not be a decode backend"
          assert "QAudioDecoder" not in media_source, "QAudioDecoder must not be an audio source"
          assert "VideoOutput" not in media_source, "Qt VideoOutput must not own decoded frames"
          assert "frameRate = 24" not in media_source and "m_frameRate = 24" not in media_source, "frame identity must not assume 24 fps"

          renderer = (root / "src/renderer/mangetsu_library.cpp").read_text(encoding="utf-8").lower()
          assert all(name not in renderer for name in ("libass", "vsfilter", "xy-vsfilter")), "renderer loader contains a fallback backend"

          workflow = (root / ".github/workflows/build.yml").read_text(encoding="utf-8")
          assert "Yoake-Windows-x64-portable.zip" in workflow
          assert "verify_portable.ps1" in workflow
